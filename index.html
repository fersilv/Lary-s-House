<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lary's House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Pacifico&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-color: #f0f;
        --secondary-color: #0ff;
        --background-color: #05020d;
        --font-family: 'Poppins', sans-serif;
        --glow-effect-css: 0 0 2px var(--primary-color), 0 0 1px var(--primary-color);
      }
      body {
        font-family: var(--font-family);
        background-color: var(--background-color);
        color: #fff;
        overflow-x: hidden;
      }
      .font-logo {
        font-family: 'Audiowide', cursive;
      }
      .font-display {
        font-family: 'Pacifico', cursive;
      }
      .text-glow {
        text-shadow: var(--glow-effect-css);
      }
      .chromatic-aberration {
        text-shadow: 
          0.05em 0 0 rgba(255,0,0,.75),
          -0.025em -0.05em 0 rgba(0,255,0,.75),
      		0.025em 0.05em 0 rgba(0,0,255,.75);
      }
      .neon-border {
        border: 2px solid var(--primary-color);
        box-shadow: 0 0 10px var(--primary-color), inset 0 0 10px var(--primary-color);
      }
      .animate-fade-in-up {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .animate-fade-in-up.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #particle-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        background: radial-gradient(ellipse at bottom, rgba(29, 3, 40, 0.4) 0%, rgba(5, 2, 13, 0) 70%);
      }
      .bg-grid-pattern {
          background-image: linear-gradient(to right, var(--grid-color) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
          background-size: 50px 50px;
          animation: scroll-grid 10s linear infinite;
      }
      .animate-neon-flicker {
        animation: neon-flicker 2.5s infinite alternate;
      }
      .splash-exit-active {
        transition: opacity 1s ease-out, transform 1s ease-out;
        opacity: 0 !important;
        transform: scale(1.2) !important;
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(10deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float-reverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(20px) rotate(-10deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes scroll-grid {
          from { background-position: 0 0; }
          to { background-position: -50px -50px; }
      }
      @keyframes neon-flicker {
          0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
              text-shadow: 0 0 2px var(--primary-color), 0 0 4px var(--primary-color);
              color: #fff;
          }
          20%, 24%, 55% {        
              text-shadow: none;
              color: #eee;
          }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.14.0"
  }
}
</script>
</head>
  <body>
    <div id="particle-background"></div>
    <div id="root"></div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
